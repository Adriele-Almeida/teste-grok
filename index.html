<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pauta</title>
    <meta
      name="description"
      content="Calendário de posts: arte, legenda, data e aprovação."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f2efe9;
        --surface: #faf8f4;
        --surface-2: #efebe3;
        --ink: #1b1916;
        --muted: #6e6960;
        --primary: #2c3632;
        --primary-fg: #f7f4ee;
        --line: rgba(27, 25, 22, 0.08);
        --ok: #3d6b4f;
        --ok-bg: #e4ede6;
        --wait: #8a6d3b;
        --wait-bg: #f3ebd8;
        --edit: #8b4a32;
        --edit-bg: #f3e4dc;
        --no: #7a3a3a;
        --no-bg: #f0e0e0;
        --shadow: 0 0 0 1px rgba(27, 25, 22, 0.06), 0 1px 2px rgba(27, 25, 22, 0.05);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); }
      body { font-family: Figtree, ui-sans-serif, system-ui, sans-serif; line-height: 1.5; }
      button, input, textarea { font: inherit; color: inherit; }
      button { cursor: pointer; }
      h1, h2, h3 { font-family: Fraunces, ui-serif, Georgia, serif; letter-spacing: -0.03em; font-weight: 500; margin: 0; }
      header { background: var(--surface); border-bottom: 1px solid var(--line); }
      .wrap { max-width: 1400px; margin: 0 auto; padding: 16px; }
      .top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
      .brand { font-family: Fraunces, serif; font-size: 1.35rem; line-height: 1; }
      .client { margin: 4px 0 0; color: var(--muted); font-size: 0.8rem; }
      .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      .toolbar { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: flex-end; margin-top: 16px; }
      .nav { display: flex; align-items: center; gap: 8px; }
      .title { min-width: 11rem; font-size: 1.35rem; }
      button.ghost, button.solid, button.pill {
        border: 0; border-radius: 999px; height: 36px; padding: 0 14px;
      }
      button.ghost { background: transparent; box-shadow: var(--shadow); }
      button.solid { background: var(--primary); color: var(--primary-fg); }
      button.danger { background: transparent; color: var(--no); box-shadow: var(--shadow); }
      .switch { display: flex; background: var(--surface-2); border-radius: 999px; padding: 4px; }
      .switch button { height: 36px; border: 0; background: transparent; border-radius: 999px; padding: 0 14px; color: var(--muted); }
      .switch button.on { background: var(--primary); color: var(--primary-fg); }
      main.layout { display: grid; gap: 20px; padding-top: 8px; }
      @media (min-width: 960px) {
        main.layout { grid-template-columns: minmax(0, 1fr) 300px; }
      }
      .hint { color: var(--muted); font-size: 0.9rem; margin: 0 0 12px; }
      .card { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); }
      .month { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
      .dow, .cell { min-height: 28px; font-size: 0.75rem; color: var(--muted); padding: 4px; }
      .cell {
        min-height: 92px; background: var(--surface); border-radius: 12px; box-shadow: var(--shadow);
        text-align: left; border: 0; display: flex; flex-direction: column; gap: 4px; align-items: stretch;
      }
      .cell.out { opacity: 0.45; }
      .cell.today { box-shadow: 0 0 0 2px var(--primary); }
      .cell .n { font-size: 0.8rem; color: var(--ink); }
      .thumbs { display: flex; gap: 3px; flex-wrap: wrap; }
      .thumbs img, .dot { width: 28px; height: 28px; border-radius: 6px; object-fit: cover; background: var(--surface-2); }
      .week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
      .daycol { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 8px; min-height: 220px; }
      .daycol h3 { font-size: 0.95rem; }
      .mini { width: 100%; border: 0; background: var(--surface-2); border-radius: 10px; padding: 6px; text-align: left; margin-top: 6px; }
      .mini img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; display: block; }
      .year { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
      .ym { border: 0; background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 12px; text-align: left; }
      .dots { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
      .dots i { width: 8px; height: 8px; border-radius: 99px; display: block; background: var(--wait); }
      .dots i.approved { background: var(--ok); }
      .dots i.changes { background: var(--edit); }
      .dots i.rejected { background: var(--no); }
      aside .card { padding: 16px; position: sticky; top: 12px; }
      .postbtn { width: 100%; display: flex; gap: 10px; border: 0; background: var(--surface-2); border-radius: 12px; padding: 8px; text-align: left; margin-top: 8px; }
      .postbtn img { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; }
      .badge { font-size: 0.7rem; border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
      .pending { background: var(--wait-bg); color: var(--wait); }
      .approved { background: var(--ok-bg); color: var(--ok); }
      .changes { background: var(--edit-bg); color: var(--edit); }
      .rejected { background: var(--no-bg); color: var(--no); }
      dialog { border: 0; border-radius: 20px; padding: 0; width: min(560px, calc(100% - 24px)); background: var(--surface); box-shadow: 0 24px 80px rgba(27, 25, 22, 0.2); }
      dialog::backdrop { background: rgba(27, 25, 22, 0.35); }
      dialog form, .sheet { padding: 20px; display: flex; flex-direction: column; gap: 12px; }
      label { display: flex; flex-direction: column; gap: 6px; font-size: 0.85rem; color: var(--muted); }
      input, textarea { border: 0; background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
      textarea { min-height: 110px; resize: vertical; }
      .art { width: 100%; max-height: 360px; object-fit: cover; border-radius: 16px; background: var(--surface-2); }
      .history { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
      .history li { background: var(--surface-2); border-radius: 12px; padding: 8px 10px; font-size: 0.85rem; }
      .muted { color: var(--muted); font-size: 0.85rem; }
      .error { color: var(--no); font-size: 0.85rem; min-height: 1.2em; }
    </style>
  </head>
  <body>
    <header>
      <div class="wrap">
        <div class="top">
          <div>
            <div class="brand">Pauta</div>
            <p class="client" id="clientName">Cliente</p>
          </div>
          <div class="row">
            <button class="ghost" id="openName" type="button">Nome do cliente</button>
            <button class="solid" id="openNew" type="button">Novo post</button>
          </div>
        </div>
        <div class="toolbar">
          <div class="nav">
            <button class="ghost" id="prev" type="button" aria-label="Anterior">←</button>
            <h1 class="title" id="cursorTitle"></h1>
            <button class="ghost" id="next" type="button" aria-label="Seguinte">→</button>
            <button class="ghost" id="today" type="button">Hoje</button>
          </div>
          <div class="switch" id="views">
            <button type="button" data-view="year">Ano</button>
            <button type="button" data-view="month">Mês</button>
            <button type="button" data-view="week">Semana</button>
          </div>
        </div>
      </div>
    </header>
    <div class="wrap">
      <main class="layout">
        <section>
          <p class="hint" id="emptyHint" hidden>Calendário vazio. Adicione um post com a arte, a legenda e o dia.</p>
          <div id="calendar"></div>
        </section>
        <aside>
          <div class="card">
            <h2 id="dayTitle">O dia</h2>
            <div id="dayList"></div>
          </div>
        </aside>
      </main>
    </div>

    <dialog id="nameDialog">
      <form id="nameForm" method="dialog">
        <h2>Nome do cliente</h2>
        <label>Como o cliente aparece nesta cópia
          <input id="nameInput" name="name" required maxlength="80" />
        </label>
        <div class="row">
          <button class="solid" type="submit">Salvar</button>
          <button class="ghost" type="button" data-close>Cancelar</button>
        </div>
      </form>
    </dialog>

    <dialog id="postDialog">
      <form id="postForm">
        <h2 id="postFormTitle">Novo post</h2>
        <label>Dia e hora
          <input id="when" type="datetime-local" required />
        </label>
        <label>Arte
          <input id="file" type="file" accept="image/*" />
        </label>
        <label>Ou cole o endereço da imagem
          <input id="url" type="url" placeholder="https://" />
        </label>
        <label>Legenda
          <textarea id="caption" required maxlength="2200"></textarea>
        </label>
        <p class="error" id="formError"></p>
        <div class="row">
          <button class="solid" type="submit">Salvar</button>
          <button class="ghost" type="button" data-close>Cancelar</button>
        </div>
      </form>
    </dialog>

    <dialog id="detailDialog">
      <div class="sheet">
        <img class="art" id="detailArt" alt="" />
        <div class="row" style="justify-content: space-between">
          <strong id="detailWhen"></strong>
          <span class="badge" id="detailBadge"></span>
        </div>
        <p id="detailCaption"></p>
        <label>Comentário
          <textarea id="comment" placeholder="O que precisa mudar"></textarea>
        </label>
        <p class="error" id="detailError"></p>
        <div class="row">
          <button class="solid" type="button" data-action="approved">Aprovar</button>
          <button class="ghost" type="button" data-action="changes">Pedir ajuste</button>
          <button class="ghost" type="button" data-action="rejected">Reprovar</button>
        </div>
        <h3>Histórico</h3>
        <ul class="history" id="history"></ul>
        <div class="row">
          <button class="danger" type="button" id="deletePost">Excluir</button>
          <button class="ghost" type="button" data-close>Fechar</button>
        </div>
      </div>
    </dialog>

    <script>
      const KEY = "pauta-board-v1";
      const TZ = "America/Sao_Paulo";
      const LABELS = { pending: "Aguardando", approved: "Aprovado", changes: "Ajuste", rejected: "Reprovado" };
      const ACTIONS = { approved: "Aprovou", changes: "Pediu ajuste", rejected: "Reprovou" };
      const WEEK = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];
      const MONTHS = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];

      let state = load();
      let view = "month";
      let cursor = todayKey();
      let selected = cursor;
      let editingId = null;

      const $ = (id) => document.getElementById(id);

      function load() {
        try {
          const raw = localStorage.getItem(KEY);
          if (!raw) return { clientName: "Cliente", posts: [], seq: 1 };
          const data = JSON.parse(raw);
          data.posts ||= [];
          data.clientName ||= "Cliente";
          data.seq ||= 1;
          return data;
        } catch {
          return { clientName: "Cliente", posts: [], seq: 1 };
        }
      }
      function save() {
        localStorage.setItem(KEY, JSON.stringify(state));
      }
      function todayKey() {
        return new Intl.DateTimeFormat("en-CA", { timeZone: TZ }).format(new Date());
      }
      function keyFromDate(date) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, "0");
        const d = String(date.getDate()).padStart(2, "0");
        return `${y}-${m}-${d}`;
      }
      function dateFromKey(key) {
        const [y, m, d] = key.split("-").map(Number);
        return new Date(y, m - 1, d, 12, 0, 0, 0);
      }
      function dateKeyFromIso(iso) {
        return new Intl.DateTimeFormat("en-CA", { timeZone: TZ }).format(new Date(iso));
      }
      function formatTime(iso) {
        return new Intl.DateTimeFormat("pt-BR", { timeZone: TZ, hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).format(new Date(iso));
      }
      function cap(text) {
        return text.charAt(0).toUpperCase() + text.slice(1);
      }
      function monthTitle(date) {
        return cap(`${MONTHS[date.getMonth()]} ${date.getFullYear()}`);
      }
      function dayHeading(key) {
        const date = dateFromKey(key);
        const weekday = new Intl.DateTimeFormat("pt-BR", { weekday: "long" }).format(date);
        return cap(`${weekday}, ${date.getDate()} de ${MONTHS[date.getMonth()]}`);
      }
      function shift(key, amount) {
        const date = dateFromKey(key);
        if (view === "year") date.setFullYear(date.getFullYear() + amount);
        else if (view === "week") date.setDate(date.getDate() + amount * 7);
        else date.setMonth(date.getMonth() + amount);
        return keyFromDate(date);
      }
      function startOfWeek(date) {
        const copy = new Date(date);
        copy.setDate(copy.getDate() - copy.getDay());
        copy.setHours(12, 0, 0, 0);
        return copy;
      }
      function postsOn(key) {
        return state.posts
          .filter((post) => dateKeyFromIso(post.scheduledAt) === key)
          .sort((a, b) => a.scheduledAt.localeCompare(b.scheduledAt));
      }
      function badge(status) {
        return `<span class="badge ${status}">${LABELS[status] || "Aguardando"}</span>`;
      }

      function render() {
        $("clientName").textContent = state.clientName;
        const date = dateFromKey(cursor);
        $("cursorTitle").textContent =
          view === "year" ? String(date.getFullYear()) : view === "week" ? `Semana de ${date.getDate()} ${MONTHS[date.getMonth()]}` : monthTitle(date);
        document.querySelectorAll("#views button").forEach((button) => {
          button.classList.toggle("on", button.dataset.view === view);
        });
        $("emptyHint").hidden = !(state.posts.length === 0 && view === "month");
        $("calendar").innerHTML = view === "year" ? yearHtml(date) : view === "week" ? weekHtml(date) : monthHtml(date);
        $("dayTitle").textContent = selected ? dayHeading(selected) : "O dia";
        const dayPosts = selected ? postsOn(selected) : [];
        $("dayList").innerHTML = dayPosts.length
          ? dayPosts.map((post) => `
              <button class="postbtn" type="button" data-open="${post.id}">
                <img src="${escapeAttr(post.mediaUrl)}" alt="" />
                <span>
                  <span class="row" style="justify-content:space-between">${formatTime(post.scheduledAt)} ${badge(post.status)}</span>
                  <span class="muted">${escapeHtml(post.caption)}</span>
                </span>
              </button>`).join("")
          : `<p class="muted">Nenhum post neste dia.</p>`;
      }

      function monthHtml(month) {
        const start = startOfWeek(new Date(month.getFullYear(), month.getMonth(), 1, 12));
        let html = WEEK.map((day) => `<div class="dow">${day}</div>`).join("");
        for (let i = 0; i < 42; i++) {
          const date = new Date(start);
          date.setDate(start.getDate() + i);
          const key = keyFromDate(date);
          const items = postsOn(key);
          const outside = date.getMonth() !== month.getMonth();
          html += `<button class="cell${outside ? " out" : ""}${key === todayKey() ? " today" : ""}" type="button" data-day="${key}">
            <span class="n">${date.getDate()}</span>
            <span class="thumbs">${items.slice(0, 3).map((post) => `<img src="${escapeAttr(post.mediaUrl)}" alt="" />`).join("")}</span>
          </button>`;
        }
        return `<div class="month">${html}</div>`;
      }
      function weekHtml(date) {
        const start = startOfWeek(date);
        let html = "";
        for (let i = 0; i < 7; i++) {
          const day = new Date(start);
          day.setDate(start.getDate() + i);
          const key = keyFromDate(day);
          const items = postsOn(key);
          html += `<div class="daycol">
            <button class="ghost" type="button" data-day="${key}"><h3>${WEEK[day.getDay()]} ${day.getDate()}</h3></button>
            ${items.map((post) => `<button class="mini" type="button" data-open="${post.id}"><img src="${escapeAttr(post.mediaUrl)}" alt="" /><span class="muted">${formatTime(post.scheduledAt)}</span></button>`).join("")}
          </div>`;
        }
        return `<div class="week">${html}</div>`;
      }
      function yearHtml(date) {
        const year = date.getFullYear();
        let html = "";
        for (let month = 0; month < 12; month++) {
          const items = state.posts.filter((post) => {
            const key = dateKeyFromIso(post.scheduledAt);
            return key.startsWith(`${year}-${String(month + 1).padStart(2, "0")}`);
          });
          html += `<button class="ym" type="button" data-month="${year}-${String(month + 1).padStart(2, "0")}-01">
            <strong>${cap(MONTHS[month])}</strong>
            <span class="muted">${items.length} post${items.length === 1 ? "" : "s"}</span>
            <span class="dots">${items.map((post) => `<i class="${post.status}"></i>`).join("")}</span>
          </button>`;
        }
        return `<div class="year">${html}</div>`;
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, (char) => ({ "&": "&", "<": "<", ">": ">", '"': """, "'": "&#39;" }[char]));
      }
      function escapeAttr(value) {
        return escapeHtml(value).replace(/`/g, "&#96;");
      }

      $("calendar").addEventListener("click", (event) => {
        const day = event.target.closest("[data-day]");
        const open = event.target.closest("[data-open]");
        const month = event.target.closest("[data-month]");
        if (open) return openDetail(Number(open.dataset.open));
        if (month) {
          cursor = month.dataset.month;
          selected = cursor;
          view = "month";
          render();
          return;
        }
        if (day) {
          selected = day.dataset.day;
          cursor = selected;
          render();
        }
      });
      $("dayList").addEventListener("click", (event) => {
        const open = event.target.closest("[data-open]");
        if (open) openDetail(Number(open.dataset.open));
      });
      $("views").addEventListener("click", (event) => {
        const button = event.target.closest("[data-view]");
        if (!button) return;
        view = button.dataset.view;
        render();
      });
      $("prev").onclick = () => { cursor = shift(cursor, -1); selected = cursor; render(); };
      $("next").onclick = () => { cursor = shift(cursor, 1); selected = cursor; render(); };
      $("today").onclick = () => { cursor = todayKey(); selected = cursor; render(); };

      $("openName").onclick = () => {
        $("nameInput").value = state.clientName;
        $("nameDialog").showModal();
      };
      $("nameForm").onsubmit = (event) => {
        event.preventDefault();
        state.clientName = $("nameInput").value.trim() || "Cliente";
        save();
        $("nameDialog").close();
        render();
      };
      $("openNew").onclick = () => {
        editingId = null;
        $("postFormTitle").textContent = "Novo post";
        $("postForm").reset();
        $("when").value = `${selected || todayKey()}T10:00`;
        $("formError").textContent = "";
        $("postDialog").showModal();
      };
      $("postForm").onsubmit = async (event) => {
        event.preventDefault();
        $("formError").textContent = "";
        const file = $("file").files[0];
        let mediaUrl = $("url").value.trim();
        try {
          if (file) mediaUrl = await fileToDataUrl(file);
        } catch {
          $("formError").textContent = "Não foi possível ler a imagem.";
          return;
        }
        if (!mediaUrl) {
          $("formError").textContent = "Escolha uma arte ou cole o endereço da imagem.";
          return;
        }
        const when = $("when").value;
        const post = {
          id: state.seq++,
          scheduledAt: new Date(`${when}:00-03:00`).toISOString(),
          caption: $("caption").value.trim(),
          mediaUrl,
          mediaAlt: "Arte do post",
          status: "pending",
          reviews: [],
        };
        state.posts.push(post);
        try { save(); } catch {
          state.posts.pop();
          $("formError").textContent = "A imagem é grande demais para ficar salva neste navegador.";
          return;
        }
        selected = dateKeyFromIso(post.scheduledAt);
        cursor = selected;
        $("postDialog").close();
        render();
      };

      function openDetail(id) {
        const post = state.posts.find((item) => item.id === id);
        if (!post) return;
        editingId = id;
        $("detailArt").src = post.mediaUrl;
        $("detailWhen").textContent = `${dayHeading(dateKeyFromIso(post.scheduledAt))} · ${formatTime(post.scheduledAt)}`;
        $("detailCaption").textContent = post.caption;
        $("detailBadge").className = `badge ${post.status}`;
        $("detailBadge").textContent = LABELS[post.status];
        $("comment").value = "";
        $("detailError").textContent = "";
        $("history").innerHTML = post.reviews.length
          ? post.reviews.map((review) => `<li><strong>${ACTIONS[review.action]}</strong> · ${escapeHtml(review.comment || "Sem comentário")}</li>`).join("")
          : `<li class="muted">Nenhum retorno ainda.</li>`;
        $("detailDialog").showModal();
      }
      $("detailDialog").addEventListener("click", (event) => {
        const action = event.target.closest("[data-action]")?.dataset.action;
        if (!action) return;
        const post = state.posts.find((item) => item.id === editingId);
        if (!post) return;
        const comment = $("comment").value.trim();
        if (action !== "approved" && !comment) {
          $("detailError").textContent = "Escreva o que precisa mudar.";
          return;
        }
        post.status = action;
        post.reviews.push({ id: state.seq++, action, comment, createdAt: new Date().toISOString() });
        save();
        openDetail(post.id);
        render();
      });
      $("deletePost").onclick = () => {
        state.posts = state.posts.filter((post) => post.id !== editingId);
        save();
        $("detailDialog").close();
        render();
      };
      document.querySelectorAll("[data-close]").forEach((button) => {
        button.onclick = () => button.closest("dialog").close();
      });

      function fileToDataUrl(file) {
        return new Promise((resolve, reject) => {
          const image = new Image();
          const url = URL.createObjectURL(file);
          image.onload = () => {
            const max = 1100;
            const scale = Math.min(1, max / Math.max(image.width, image.height));
            const canvas = document.createElement("canvas");
            canvas.width = Math.max(1, Math.round(image.width * scale));
            canvas.height = Math.max(1, Math.round(image.height * scale));
            canvas.getContext("2d").drawImage(image, 0, 0, canvas.width, canvas.height);
            URL.revokeObjectURL(url);
            resolve(canvas.toDataURL("image/jpeg", 0.82));
          };
          image.onerror = () => {
            URL.revokeObjectURL(url);
            reject(new Error("image"));
          };
          image.src = url;
        });
      }

      render();
    </script>
  </body>
</html>
